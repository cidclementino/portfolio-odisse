<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Página não encontrada — Odisse</title>
<script>
  (function () {
    var path = window.location.pathname;
    // Endereços antigos de projeto — /projetos/<slug>/ (Jekyll) e /projects/<slug>
    // (primeira versão) — passam para a página única /projeto/?p=<slug>
    var en = /^\/en(\/|$)/.test(path);
    if (en) document.documentElement.className = 'lang-en';
    var match = path.match(/^(?:\/en)?\/(?:projetos|projects)\/([^\/]+?)(?:\.html)?\/?$/);
    if (match) {
      window.location.replace((en ? '/en/project/?p=' : '/projeto/?p=') + encodeURIComponent(match[1]));
      return;
    }
    if (/^(\/en)?\/(projetos|projects)\/?$/.test(path)) {
      window.location.replace(en ? '/en/' : '/');
    }
  })();
</script>

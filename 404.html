<!DOCTYPE html>
<html lang="pt-BR">
<head>
<title>Página não encontrada — Odisse</title>
<script>
  (function () {
    var path = window.location.pathname;
    // Endereços antigos de projeto — /projetos/<slug>/ (Jekyll) e /projects/<slug>
    // (primeira versão) — passam para a página única /projeto/?p=<slug>
    var match = path.match(/^\/(?:projetos|projects)\/([^\/]+?)(?:\.html)?\/?$/);
    if (match) {
      window.location.replace('/projeto/?p=' + encodeURIComponent(match[1]));
      return;
    }
    if (/^\/(projetos|projects)\/?$/.test(path)) {
      window.location.replace('/');
    }
  })();
</script>
{% include head.html %}
</head>
<body data-pagina="404">
  <main class="nao-encontrada">
    <h1>Página não encontrada</h1>
    <p><a href="{{ '/' | relative_url }}">Voltar para os projetos</a></p>
  </main>
</body>
</html>

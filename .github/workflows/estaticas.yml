name: Páginas estáticas (Google e previews)

# Regrava, a partir da nuvem, as páginas próprias dos projetos (PT e EN), Sobre, Contato,
# Privacidade e notícias já desenhados, as imagens de preview, _data/busca.json,
# _data/projetos.json (sitemap) e _data/paginas.json.
# Quando roda:
#   - o Worker pede (workflow_dispatch) depois de cada gravação no painel e uma vez por dia;
#   - depois de cada publicação da API;
#   - uma vez por dia por conta própria (reserva, se o Worker não puder pedir);
#   - à mão em Actions → "Páginas estáticas" → Run workflow.
# Só faz commit quando algo mudou.
on:
  schedule:
    - cron: '17 6 * * *' # 3h17 de Brasília
  workflow_run:
    workflows: ['Publicar API (Cloudflare Worker)']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: estaticas
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar sharp
        run: npm install --no-save --no-package-lock sharp@0.33
      - name: Gerar
        run: node scripts/gerar-estaticas.mjs
      - name: Gravar se mudou
        id: gravar
        run: |
          git add -A projetos en/projects assets/og _includes/gerado _data/busca.json _data/projetos.json _data/paginas.json
          if git diff --cached --quiet; then
            echo "Nada mudou."
            echo "mudou=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="odisse-site[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Páginas estáticas atualizadas a partir do painel"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "mudou=1" >> "$GITHUB_OUTPUT"
      # commits feitos pelo próprio workflow podem não disparar a publicação do site: pede uma
      - name: Publicar o site
        if: steps.gravar.outputs.mudou == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true

name: Teste de build (temporário)
on:
  push:
    branches: [teste-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Guardar o resultado numa branch
        run: |
          sudo chown -R "$(id -u)" _site
          cd _site
          git init -q && git checkout -q -b teste-site
          git add -A && git -c user.name=bot -c user.email=bot@x commit -qm site
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" teste-site

<footer{% if page.url contains 'sobre' or page.url contains 'contato' %} class="footer--dark"{% endif %}>
  <div class="wrap">
    <span class="footer__selo">{% include selo-mao.svg %}</span>
    <a class="footer__marca" href="{{ '/' | relative_url }}" aria-label="Odisse — início">{% include marca-odisse.svg %}</a>
    <ul>
      <li><a href="{{ '/sobre/' | relative_url }}">Sobre</a></li>
      <li><a href="{{ '/' | relative_url }}">Projetos</a></li>
      <li><a href="{{ '/contato/' | relative_url }}">Contato</a></li>
    </ul>
    <p class="copy">© <span id="ano-atual">{{ 'now' | date: "%Y" }}</span> Odisse — Estúdio de Arquitetura &amp; Design. João Pessoa, PB.</p>
  </div>
</footer>

name = "site-odisse"
main = "index.js"
compatibility_date = "2026-07-01"

# Namespace KV "SITE_ODISSE". O workflow "Publicar API" cria o namespace
# na primeira publicação (se ainda não existir) e troca o marcador abaixo
# pelo id verdadeiro antes de publicar — não é preciso editar nada aqui.
kv_namespaces = [
  { binding = "SITE", id = "__KV_ID__" },
]

# A senha do painel (SITE_SENHA) e o token do GitHub (GH_TOKEN, a partir do secret
# GH_DISPATCH_TOKEN) são enviados pelo GitHub Actions — nunca coloque os valores aqui.

# Todo dia às 6h de Brasília (9h UTC): pede ao GitHub a geração das páginas estáticas
# (para as notícias novas da Elaia entrarem). No dia 1 de cada mês, também o backup mensal
# de projetos e páginas — fica no próprio KV (12 mensais + 5 manuais), painel → Histórico.
[triggers]
crons = ["0 9 * * *"]
